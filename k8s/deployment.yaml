# One copy of ES Portfolio. Sign-in sessions and the cache are files inside the container, so two
# copies must not share the traffic for long. On a deploy the new copy starts first (database backup,
# migrations), and only when it answers /ready is the old one stopped: no pause for visitors. For those
# few seconds either copy may answer; a form opened on the old copy can ask for a reload (page expired).
# Stopping the old copy first (strategy Recreate) was measured on 17 Nov 2026: about 40 seconds of 503.
#
# The disks are the same folders the Docker container used (hostPath), so moving to the cluster
# copies no data, the nightly backups keep covering them, and going back to Docker is one command.
# They tie the app to this server; they become S3 or real cluster volumes when the apps move to AWS.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: es-portfolio
  labels: {app: es-portfolio}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: es-portfolio}
  template:
    metadata:
      labels: {app: es-portfolio}
    spec:
      # The start script does not pass the stop signal on to Apache, so do not wait the default 30 seconds.
      terminationGracePeriodSeconds: 15
      containers:
        - name: web
          image: es-portfolio           # tag set per deploy (kustomize `images`)
          imagePullPolicy: IfNotPresent # on k3s the image is imported, not pulled
          ports: [{name: http, containerPort: 80}]
          envFrom:
            - secretRef: {name: es-portfolio-env}   # made from the server's .env.prod by deploy-k3s.sh
          # Start-up behaviour, the same values docker-compose.prod.yml sets.
          env:
            - {name: SKIP_ASSET_BUILD, value: "true"}
            - {name: FORCE_FRESH_DB, value: "false"}
            - {name: CREATE_DB_BACKUP, value: "true"}
            - {name: REQUIRE_DB_ON_BOOT, value: "true"}
          volumeMounts:
            - {name: backups, mountPath: /var/www/html/storage/app/backups}
            - {name: storage, mountPath: /var/www/html/storage/app/public}
            - {name: themes, mountPath: /var/www/html/storage/app/themes}
          # Keep serving for a few seconds after Kubernetes decides to stop this copy: Traefik needs a
          # moment to learn it is gone, and without the pause a request can land on a closed pod.
          lifecycle:
            preStop:
              exec: {command: ["sleep", "8"]}
          # bin/start-apache.sh backs up the database and runs migrations before Apache starts.
          # /ready answers only when the database and storage work.
          startupProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
            failureThreshold: 72
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
      volumes:
        - name: backups
          hostPath: {path: /var/lib/docker/volumes/edfolio_prod_backups/_data, type: Directory}
        - name: storage
          hostPath: {path: /var/lib/docker/volumes/edfolio_edfolio_storage/_data, type: Directory}
        - name: themes
          hostPath: {path: /var/lib/docker/volumes/edfolio_edfolio_themes/_data, type: Directory}
