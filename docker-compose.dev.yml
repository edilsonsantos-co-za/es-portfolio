services:
  app:
    container_name: es-portfolio-dev
    image: es-portfolio:latest
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.dev
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
      # Explicit backup volume for easy access
      - ./storage/app/backups:/var/www/html/storage/app/backups
    networks:
      milkyway:
        # The local proxy host still forwards edilsonsantos.local to the old name; drop once it points at es-portfolio-dev
        aliases:
          - edfolio-dev
    environment:
      # Docker startup behavior for development
      - SKIP_ASSET_BUILD=false
      # Set to true to drop and reseed the shared dev database on start
      - FORCE_FRESH_DB=${FORCE_FRESH_DB:-false}
      - CREATE_DB_BACKUP=true
      - RUN_MIGRATIONS=auto
      - RUN_SEEDING=auto

networks:
  milkyway:
    external: true

volumes:
  node_modules:
