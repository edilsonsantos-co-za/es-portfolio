services:
  app:
    container_name: edfolio
    image: edfolio:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - APP_ENV=local
    env_file:
      - .env.local
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    environment:
      - APP_NAME=EdFolio
      - APP_ENV=local
      - APP_KEY=REDACTED
      - APP_DEBUG=true
      - APP_URL=http://localhost
      - LOG_CHANNEL=stack
      - LOG_LEVEL=debug
      - DB_CONNECTION=mysql
      - DB_HOST=dsl-mysql
      - DB_PORT=3306
      - DB_DATABASE=edfolio
      - DB_USERNAME=edfolio_user
      - DB_PASSWORD=REDACTED
    networks:
      - milkyway

networks:
  milkyway:
    external: true
