services:
  app:
    container_name: edfolio
    image: edfolio:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - APP_ENV=local
    env_file:
      - .env.local
    restart: on-failure:3
    volumes:
      - .:/var/www/html
    environment:
      - APP_NAME=EdFolio
      - APP_ENV=local
      - APP_KEY=REDACTED
      - APP_DEBUG=true
      - APP_URL=http://localhost
      - LOG_CHANNEL=stack
      - LOG_LEVEL=debug
      - DB_CONNECTION=mysql
      - DB_HOST=dsl-mysql
      - DB_PORT=3306
      - DB_DATABASE=edfolio
      - DB_USERNAME=edfolio_user
      - DB_PASSWORD=REDACTED
    networks:
      - milkyway
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  milkyway:
    external: true
