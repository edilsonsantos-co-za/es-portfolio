name: CI and Deploy

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  DOCKERHUB_NAMESPACE: datasparklab

permissions:
  contents: read

concurrency:
  group: validate-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction

      - name: Install Node dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Run repository validation
        run: bash ./bin/validate.sh

  build-and-publish:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.image.outputs.tag }}

    steps:
      - name: Validate Docker Hub publish configuration
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          missing=()

          [[ -n "${DOCKERHUB_USERNAME}" ]] || missing+=("DOCKERHUB_USERNAME")
          [[ -n "${DOCKERHUB_TOKEN}" ]] || missing+=("DOCKERHUB_TOKEN")

          if [[ "${#missing[@]}" -gt 0 ]]; then
            printf 'Missing required repository or organization secret(s): %s\n' "${missing[*]}" >&2
            printf 'The build-and-publish job is not environment-scoped, so DOCKERHUB_* must be configured as repository or organization secrets.\n' >&2
            printf 'Bootstrap them with ./bin/setup-github-secrets.sh or gh secret set before re-running this workflow.\n' >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5

      - name: Derive image metadata
        id: image
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          IMMUTABLE_TAG="sha-${GITHUB_SHA::12}"
          IMAGE_NAME="${DOCKERHUB_NAMESPACE}/${GITHUB_REPOSITORY#*/}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'VERSION must use semantic version format X.Y.Z. Found: %s\n' "$VERSION" >&2
            exit 1
          fi

          echo "name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$IMMUTABLE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          NODE_OPTIONS="--max-old-space-size=768" npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    needs: build-and-publish
    if: needs.build-and-publish.result == 'success'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Validate production deploy configuration
        env:
          APP_IMAGE: ${{ format('{0}/{1}', env.DOCKERHUB_NAMESPACE, github.event.repository.name) }}
          APP_IMAGE_TAG: ${{ needs.build-and-publish.outputs.tag }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          missing=()

          [[ -n "${APP_IMAGE}" ]] || missing+=("APP_IMAGE")
          [[ -n "${APP_IMAGE_TAG}" ]] || missing+=("APP_IMAGE_TAG")
          [[ -n "${DOCKERHUB_USERNAME}" ]] || missing+=("DOCKERHUB_USERNAME")
          [[ -n "${DOCKERHUB_TOKEN}" ]] || missing+=("DOCKERHUB_TOKEN")
          [[ -n "${DEPLOY_HOST}" ]] || missing+=("DEPLOY_HOST")
          [[ -n "${DEPLOY_USER}" ]] || missing+=("DEPLOY_USER")
          [[ -n "${DEPLOY_PATH}" ]] || missing+=("DEPLOY_PATH")
          [[ -n "${DEPLOY_SSH_PRIVATE_KEY}" ]] || missing+=("DEPLOY_SSH_PRIVATE_KEY")

          if [[ "${#missing[@]}" -gt 0 ]]; then
            printf 'Missing required deploy secret(s): %s\n' "${missing[*]}" >&2
            printf 'Create the production environment and configure its deploy secrets before re-running this workflow.\n' >&2
            exit 1
          fi

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_IMAGE: ${{ format('{0}/{1}', env.DOCKERHUB_NAMESPACE, github.event.repository.name) }}
          APP_IMAGE_TAG: ${{ needs.build-and-publish.outputs.tag }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          script_stop: true
          envs: APP_IMAGE,APP_IMAGE_TAG,DEPLOY_PATH,DOCKERHUB_TOKEN,DOCKERHUB_USERNAME
          script: |
            set -euo pipefail
            compose_file="${DEPLOY_PATH}/.edfolio-deploy-compose.yml"
            cleanup() {
              rm -f "$compose_file"
            }
            trap cleanup EXIT

            printf '%s\n' \
              'name: edfolio' \
              'services:' \
              '  app:' \
              '    container_name: edfolio-prod' \
              "    image: ${APP_IMAGE}:${APP_IMAGE_TAG}" \
              '    pull_policy: always' \
              '    env_file:' \
              "      - ${DEPLOY_PATH}/.env.prod" \
              '    restart: on-failure:3' \
              '    volumes:' \
              '      - prod_backups:/var/www/html/storage/app/backups' \
              '      - edfolio_storage:/var/www/html/storage/app/public' \
              '    networks:' \
              '      - milkyway' \
               '    environment:' \
               '      - SKIP_ASSET_BUILD=true' \
               '      - FORCE_FRESH_DB=false' \
               '      - CREATE_DB_BACKUP=true' \
               '      - REQUIRE_DB_ON_BOOT=true' \
               '    logging:' \
              '      driver: "json-file"' \
              '      options:' \
              '        max-size: "10m"' \
              '        max-file: "3"' \
              '    healthcheck:' \
              '      test: ["CMD", "curl", "-f", "http://localhost/ready"]' \
              '      interval: 30s' \
              '      timeout: 10s' \
              '      retries: 3' \
              '      start_period: 60s' \
              '' \
              'volumes:' \
              '  prod_backups:' \
              '  edfolio_storage:' \
              '' \
              'networks:' \
              '  milkyway:' \
              '    external: true' \
              > "$compose_file"

            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            cd "$DEPLOY_PATH"
            docker compose -f "$compose_file" pull app
            docker compose -f "$compose_file" up -d --remove-orphans app
            docker ps --filter "name=^/edfolio-prod$" --format '{{.Names}} {{.Status}}'

            if ! docker ps --filter "name=^/edfolio-prod$" --format '{{.Names}}' | grep -qx 'edfolio-prod'; then
              printf 'Expected container edfolio-prod is not running after deployment.\n' >&2
              docker compose -f "$compose_file" ps >&2 || true
              docker logs edfolio-prod --tail 50 >&2 || true
              exit 1
            fi

            docker image prune -f

  notify-google-chat:
    needs:
      - validate
      - build-and-publish
      - deploy-production
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}

    steps:
      - name: Build Google Chat notification payload
        env:
          BEFORE_SHA: ${{ github.event.before }}
          BUILD_RESULT: ${{ needs.build-and-publish.result }}
          DEPLOY_RESULT: ${{ needs.deploy-production.result }}
          GITHUB_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ needs.build-and-publish.outputs.tag }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          owner_repo = os.environ["GITHUB_REPOSITORY"]
          owner, repo = owner_repo.split("/", 1)
          sha = os.environ["GITHUB_SHA"]
          short_sha = sha[:12]
          branch = os.environ["GITHUB_REF"].removeprefix("refs/heads/")
          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{owner_repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}"

          validate_result = os.environ["VALIDATE_RESULT"]
          build_result = os.environ["BUILD_RESULT"]
          deploy_result = os.environ["DEPLOY_RESULT"]

          overall_status = "SUCCESS" if all(
              result == "success" for result in (validate_result, build_result, deploy_result)
          ) else "FAILURE"

          headers = {
              "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "edfolio-google-chat-notifier",
          }

          def github_api(path: str) -> dict:
              request = urllib.request.Request(
                  f"https://api.github.com{path}",
                  headers=headers,
              )
              with urllib.request.urlopen(request) as response:
                  return json.loads(response.read().decode("utf-8"))

          commit_data = github_api(f"/repos/{owner_repo}/commits/{sha}")

          files = []
          before_sha = os.environ.get("BEFORE_SHA", "")
          if before_sha and set(before_sha) != {"0"}:
              try:
                  compare_data = github_api(f"/repos/{owner_repo}/compare/{before_sha}...{sha}")
                  files = compare_data.get("files", [])
              except Exception:
                  files = []

          if not files:
              files = commit_data.get("files", [])

          formatted_files = [
              f"- {file_info.get('status', 'modified')}: {file_info['filename']}"
              for file_info in files[:15]
          ]

          if len(files) > 15:
              formatted_files.append(f"- ...and {len(files) - 15} more")

          commit_message = commit_data["commit"]["message"].splitlines()[0]
          author_name = commit_data["commit"]["author"]["name"]
          triggered_by = os.environ["GITHUB_ACTOR"]

          lines = [
              f"Deployment {overall_status}",
              f"Repository: {owner_repo}",
              f"Branch: {branch}",
              f"Commit: {short_sha}",
              f"Author: {author_name}",
              f"Triggered by: {triggered_by}",
              f"Message: {commit_message}",
              f"Image tag: {os.environ.get('IMAGE_TAG', 'n/a')}",
              f"Validate: {validate_result}",
              f"Build and publish: {build_result}",
              f"Deploy production: {deploy_result}",
              f"Run: {run_url}",
              "Files changed:",
          ]

          if formatted_files:
              lines.extend(formatted_files)
          else:
              lines.append("- No file list available")

          with open("google-chat-payload.json", "w", encoding="utf-8") as payload_file:
              json.dump({"text": "\n".join(lines)}, payload_file)
          PY

      - name: Send Google Chat notification
        if: ${{ env.GOOGLE_CHAT_WEBHOOK_URL != '' }}
        continue-on-error: true
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H 'Content-Type: application/json; charset=UTF-8' \
            --data @google-chat-payload.json \
            "$GOOGLE_CHAT_WEBHOOK_URL"

      - name: Skip Google Chat notification
        if: ${{ env.GOOGLE_CHAT_WEBHOOK_URL == '' }}
        run: echo 'Skipping Google Chat notification because GOOGLE_CHAT_WEBHOOK_URL is not configured.'
