name: CI and Deploy

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  DOCKERHUB_NAMESPACE: datasparklab

permissions:
  contents: read

concurrency:
  group: validate-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction

      - name: Install Node dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Run repository validation
        run: bash ./bin/validate.sh

  build-and-publish:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.image.outputs.tag }}

    steps:
      - name: Validate Docker Hub publish configuration
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          missing=()

          [[ -n "${DOCKERHUB_USERNAME}" ]] || missing+=("DOCKERHUB_USERNAME")
          [[ -n "${DOCKERHUB_TOKEN}" ]] || missing+=("DOCKERHUB_TOKEN")

          if [[ "${#missing[@]}" -gt 0 ]]; then
            printf 'Missing required repository or organization secret(s): %s\n' "${missing[*]}" >&2
            printf 'The build-and-publish job is not environment-scoped, so DOCKERHUB_* must be configured as repository or organization secrets.\n' >&2
            printf 'Bootstrap them with ./bin/setup-github-secrets.sh or gh secret set before re-running this workflow.\n' >&2
            exit 1
          fi

      - name: Derive image metadata
        id: image
        run: |
          IMAGE_NAME="${DOCKERHUB_NAMESPACE}/${GITHUB_REPOSITORY#*/}"
          IMAGE_TAG="${GITHUB_SHA::12}"
          echo "name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          NODE_OPTIONS="--max-old-space-size=768" npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    needs: build-and-publish
    if: needs.build-and-publish.result == 'success'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Validate production deploy configuration
        env:
          APP_IMAGE: ${{ format('{0}/{1}', env.DOCKERHUB_NAMESPACE, github.event.repository.name) }}
          APP_IMAGE_TAG: ${{ needs.build-and-publish.outputs.tag }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          missing=()

          [[ -n "${APP_IMAGE}" ]] || missing+=("APP_IMAGE")
          [[ -n "${APP_IMAGE_TAG}" ]] || missing+=("APP_IMAGE_TAG")
          [[ -n "${DOCKERHUB_USERNAME}" ]] || missing+=("DOCKERHUB_USERNAME")
          [[ -n "${DOCKERHUB_TOKEN}" ]] || missing+=("DOCKERHUB_TOKEN")
          [[ -n "${DEPLOY_HOST}" ]] || missing+=("DEPLOY_HOST")
          [[ -n "${DEPLOY_USER}" ]] || missing+=("DEPLOY_USER")
          [[ -n "${DEPLOY_PATH}" ]] || missing+=("DEPLOY_PATH")
          [[ -n "${DEPLOY_SSH_PRIVATE_KEY}" ]] || missing+=("DEPLOY_SSH_PRIVATE_KEY")

          if [[ "${#missing[@]}" -gt 0 ]]; then
            printf 'Missing required deploy secret(s): %s\n' "${missing[*]}" >&2
            printf 'Create the production environment and configure its deploy secrets before re-running this workflow.\n' >&2
            exit 1
          fi

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_IMAGE: ${{ format('{0}/{1}', env.DOCKERHUB_NAMESPACE, github.event.repository.name) }}
          APP_IMAGE_TAG: ${{ needs.build-and-publish.outputs.tag }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          script_stop: true
          envs: APP_IMAGE,APP_IMAGE_TAG,DEPLOY_PATH,DOCKERHUB_TOKEN,DOCKERHUB_USERNAME
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            APP_IMAGE="$APP_IMAGE" APP_IMAGE_TAG="$APP_IMAGE_TAG" docker compose -f docker-compose.prod.yml pull
            APP_IMAGE="$APP_IMAGE" APP_IMAGE_TAG="$APP_IMAGE_TAG" docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
