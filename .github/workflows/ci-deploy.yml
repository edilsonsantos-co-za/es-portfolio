name: CI and Deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction

      - name: Install Node dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Run repository validation
        run: bash ./bin/validate.sh

  # Every push to main goes live. Ships the committed files straight to the VPS and builds them there: no image registry.
  # Same layout as `console vps:deploy` (linux-workspace): files land in APP_DIR with a
  # .deploy-manifest, and server-only .env files are never shipped or overwritten.
  # Secrets (environment "production"): DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_PRIVATE_KEY,
  # optional DEPLOY_KNOWN_HOSTS (else ssh-keyscan) and DEPLOY_PATH (else APP_DIR below).
  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    env:
      APP_DIR: /workspace/edilsonsantos-co-za/edfolio
      COMPOSE_FILE: docker-compose.prod.yml
      REQUIRED_ENV_FILES: ".env.prod"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          NODE_OPTIONS="--max-old-space-size=768" npm run build

      - name: Set up SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          missing=()
          [[ -n "$DEPLOY_HOST" ]] || missing+=(DEPLOY_HOST)
          [[ -n "$DEPLOY_USER" ]] || missing+=(DEPLOY_USER)
          [[ -n "$DEPLOY_SSH_PRIVATE_KEY" ]] || missing+=(DEPLOY_SSH_PRIVATE_KEY)
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Missing deploy secret(s) in the production environment: ${missing[*]}"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [[ -n "$DEPLOY_KNOWN_HOSTS" ]]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            # No pinned host key: trust the first one seen (set DEPLOY_KNOWN_HOSTS to pin it)
            ssh-keyscan -T 30 "$DEPLOY_HOST" > ~/.ssh/known_hosts 2>/dev/null || true
          fi
          printf 'Host vps\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  BatchMode yes\n  StrictHostKeyChecking accept-new\n  ConnectTimeout 30\n  ServerAliveInterval 30\n' "$DEPLOY_HOST" "$DEPLOY_USER" > ~/.ssh/config
          ssh vps true || { echo "::error::Cannot SSH to the VPS as $DEPLOY_USER (port 22 reachable from GitHub runners? key authorised?)"; exit 1; }
          # DEPLOY_PATH is either this app's folder or the workspace root. The folder under the root
          # comes from APP_DIR, not the repo name, so renaming the repo never moves the app on the
          # server (a new folder would mean a new compose project with empty volumes).
          if [[ -n "$DEPLOY_PATH" ]]; then
            if [[ "$(basename "$DEPLOY_PATH")" == "$(basename "$APP_DIR")" ]]; then
              APP_DIR="$DEPLOY_PATH"
            else
              APP_DIR="${DEPLOY_PATH%/}/${APP_DIR#/workspace/}"
            fi
          fi
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          # Earlier deploys left root-owned files: use passwordless sudo on the server when the user has it
          if ssh vps 'sudo -n true' 2>/dev/null; then echo "REMOTE_SUDO=sudo -n" >> "$GITHUB_ENV"; else echo "REMOTE_SUDO=" >> "$GITHUB_ENV"; fi

      - name: Ship committed files
        env:
          MAILTRAP_USERNAME: ${{ secrets.MAILTRAP_USERNAME }}
          MAILTRAP_PASSWORD: ${{ secrets.MAILTRAP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM_ADDRESS: ${{ secrets.MAIL_FROM_ADDRESS }}
        run: |
          # Everything git tracks except env files (examples excepted): the server keeps its own .env*.
          # Each part ends in || true: the step runs with bash -e, and a grep that matches nothing would end the list early.
          { git ls-files | grep -vE '(^|/)\.env' || true ; git ls-files | grep -E '(^|/)\.env[^/]*\.example$' || true ; find public/build -type f || true ; } | sort -u > .deploy-manifest.new
          tar -czf - -T .deploy-manifest.new .deploy-manifest.new | ssh vps "set -e; $REMOTE_SUDO mkdir -p '$APP_DIR'; $REMOTE_SUDO tar -xzf - -C '$APP_DIR'"
          # Real mail settings travel as one base64 value (nothing printed; quotes in a password can't break the command)
          SMTP_B64=""
          if [ -n "$SMTP_HOST" ]; then
            SMTP_B64="$(printf 'SMTP_HOST=%s\nSMTP_PORT=%s\nSMTP_USERNAME=%s\nSMTP_PASSWORD=%s\nMAIL_FROM_ADDRESS=%s\n' "$SMTP_HOST" "${SMTP_PORT:-587}" "$SMTP_USERNAME" "$SMTP_PASSWORD" "$MAIL_FROM_ADDRESS" | base64 -w0)"
          fi
          ssh vps "$REMOTE_SUDO env APP_DIR='$APP_DIR' RELEASE='${GITHUB_SHA::12} ${GITHUB_REF_NAME}' REQUIRED_ENV_FILES='$REQUIRED_ENV_FILES' MAILTRAP_USERNAME='$MAILTRAP_USERNAME' MAILTRAP_PASSWORD='$MAILTRAP_PASSWORD' SMTP_B64='$SMTP_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          # Files an earlier deploy shipped that are gone in this one
          if [ -f .deploy-manifest ]; then
            comm -23 <(sort .deploy-manifest) <(sort .deploy-manifest.new) | while IFS= read -r f; do [ -n "$f" ] && rm -f -- "./$f"; done
          fi
          mv .deploy-manifest.new .deploy-manifest
          echo "$RELEASE $(date -u +%FT%TZ)" > .deploy-release
          # Create or complete the server-only env file (database, SSO link, mail); nothing printed.
          # </dev/null: the script runs docker exec -i, which would otherwise eat the rest of this heredoc.
          bash bin/server-env.sh < /dev/null
          missing=""
          for f in $REQUIRED_ENV_FILES; do [ -f "$f" ] || missing="$missing $APP_DIR/$f"; done
          if [ -n "$missing" ]; then
            echo "::error::Missing on the server:$missing. Create it from the repo's example env file, then re-run this workflow."
            exit 1
          fi
          REMOTE

      - name: Build and start on the VPS
        run: |
          ssh vps "$REMOTE_SUDO env APP_DIR='$APP_DIR' COMPOSE_FILE='$COMPOSE_FILE' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          if ! docker compose -f "$COMPOSE_FILE" up -d --build --remove-orphans --wait --wait-timeout 300; then
            docker compose -f "$COMPOSE_FILE" ps
            docker compose -f "$COMPOSE_FILE" logs --tail 80
            exit 1
          fi
          docker compose -f "$COMPOSE_FILE" ps
          docker image prune -f >/dev/null
          REMOTE

  notify-google-chat:
    needs:
      - validate
      - deploy
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}

    steps:
      - name: Build Google Chat notification payload
        env:
          BEFORE_SHA: ${{ github.event.before }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          GITHUB_TOKEN: ${{ github.token }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          owner_repo = os.environ["GITHUB_REPOSITORY"]
          owner, repo = owner_repo.split("/", 1)
          sha = os.environ["GITHUB_SHA"]
          short_sha = sha[:12]
          branch = os.environ["GITHUB_REF"].removeprefix("refs/heads/")
          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{owner_repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}"

          validate_result = os.environ["VALIDATE_RESULT"]
          deploy_result = os.environ["DEPLOY_RESULT"]

          overall_status = "SUCCESS" if all(
              result == "success" for result in (validate_result, deploy_result)
          ) else "FAILURE"

          headers = {
              "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "edfolio-google-chat-notifier",
          }

          def github_api(path: str) -> dict:
              request = urllib.request.Request(
                  f"https://api.github.com{path}",
                  headers=headers,
              )
              with urllib.request.urlopen(request) as response:
                  return json.loads(response.read().decode("utf-8"))

          commit_data = github_api(f"/repos/{owner_repo}/commits/{sha}")

          files = []
          before_sha = os.environ.get("BEFORE_SHA", "")
          if before_sha and set(before_sha) != {"0"}:
              try:
                  compare_data = github_api(f"/repos/{owner_repo}/compare/{before_sha}...{sha}")
                  files = compare_data.get("files", [])
              except Exception:
                  files = []

          if not files:
              files = commit_data.get("files", [])

          formatted_files = [
              f"- {file_info.get('status', 'modified')}: {file_info['filename']}"
              for file_info in files[:15]
          ]

          if len(files) > 15:
              formatted_files.append(f"- ...and {len(files) - 15} more")

          commit_message = commit_data["commit"]["message"].splitlines()[0]
          author_name = commit_data["commit"]["author"]["name"]
          triggered_by = os.environ["GITHUB_ACTOR"]

          lines = [
              f"Deployment {overall_status}",
              f"Repository: {owner_repo}",
              f"Branch: {branch}",
              f"Commit: {short_sha}",
              f"Author: {author_name}",
              f"Triggered by: {triggered_by}",
              f"Message: {commit_message}",
              f"Validate: {validate_result}",
              f"Deploy production: {deploy_result}",
              f"Run: {run_url}",
              "Files changed:",
          ]

          if formatted_files:
              lines.extend(formatted_files)
          else:
              lines.append("- No file list available")

          with open("google-chat-payload.json", "w", encoding="utf-8") as payload_file:
              json.dump({"text": "\n".join(lines)}, payload_file)
          PY

      - name: Send Google Chat notification
        if: ${{ env.GOOGLE_CHAT_WEBHOOK_URL != '' }}
        continue-on-error: true
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H 'Content-Type: application/json; charset=UTF-8' \
            --data @google-chat-payload.json \
            "$GOOGLE_CHAT_WEBHOOK_URL"

      - name: Skip Google Chat notification
        if: ${{ env.GOOGLE_CHAT_WEBHOOK_URL == '' }}
        run: echo 'Skipping Google Chat notification because GOOGLE_CHAT_WEBHOOK_URL is not configured.'
