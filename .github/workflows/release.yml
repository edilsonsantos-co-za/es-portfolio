name: Release Validation

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  validate-release-tag:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate VERSION matches tag
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          EXPECTED_TAG="v${VERSION}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'VERSION must use semantic version format X.Y.Z. Found: %s\n' "$VERSION" >&2
            exit 1
          fi

          if [[ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]]; then
            printf 'VERSION mismatch: VERSION=%s but pushed tag=%s\n' "$VERSION" "$GITHUB_REF_NAME" >&2
            exit 1
          fi

          printf 'Release tag %s matches VERSION=%s.\n' "$GITHUB_REF_NAME" "$VERSION"
