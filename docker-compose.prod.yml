name: edfolio

services:
  assets:
    container_name: edfolio-assets
    build:
      context: .
      dockerfile: Dockerfile
      target: assets
    restart: "no"
    working_dir: /app
    command: >
      sh -lc "rm -rf /output/js /output/mix-manifest.json /output/.ready &&
      NODE_OPTIONS='--max-old-space-size=768' npm run build &&
      mkdir -p /output &&
      cp -R public/js /output/js &&
      cp public/mix-manifest.json /output/mix-manifest.json &&
      touch /output/.ready"
    volumes:
      - edfolio_frontend_assets:/output
    mem_limit: 2g

  app:
    container_name: edfolio-prod
    image: edfolio:latest
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      assets:
        condition: service_completed_successfully
    env_file:
      - .env.prod
    restart: on-failure:3
    volumes:
      # Named volume for persistent backups
      - prod_backups:/var/www/html/storage/app/backups
      # Named volume for local-disk uploads when MEDIA_DISK=public
      - edfolio_storage:/var/www/html/storage/app/public
      # Named volume populated by the one-shot assets builder service
      - edfolio_frontend_assets:/var/www/html/.frontend-assets
    networks:
      - milkyway
    environment:
      # Docker startup behavior for production
      - SKIP_ASSET_BUILD=true
      - FORCE_FRESH_DB=false
      - CREATE_DB_BACKUP=true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  prod_backups:
  edfolio_storage:
  edfolio_frontend_assets:

networks:
  milkyway:
    external: true
