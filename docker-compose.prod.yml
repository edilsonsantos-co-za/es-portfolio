services:
  app:
    container_name: edfolio-prod
    image: edfolio:latest
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.prod
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      # Named volume for persistent backups
      - prod_backups:/var/www/html/storage/app/backups
    networks:
      - milkyway
    environment:
      # Docker startup behavior for production
      - SKIP_ASSET_BUILD=false
      - FORCE_FRESH_DB=true
      - CREATE_DB_BACKUP=true

volumes:
  prod_backups:
    driver: local

networks:
  milkyway:
    external: true
