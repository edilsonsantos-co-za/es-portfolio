name: edfolio

services:
  app:
    container_name: edfolio-prod
    image: edfolio:latest
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.prod
    restart: on-failure:3
    volumes:
      # Named volume for persistent backups
      - prod_backups:/var/www/html/storage/app/backups
      # Named volume for local-disk uploads when MEDIA_DISK=public
      - edfolio_storage:/var/www/html/storage/app/public
    networks:
      - milkyway
    environment:
      # Docker startup behavior for production
      - SKIP_ASSET_BUILD=false
      - FORCE_FRESH_DB=false
      - CREATE_DB_BACKUP=true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  prod_backups:
  edfolio_storage:

networks:
  milkyway:
    external: true
