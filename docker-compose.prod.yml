name: es-portfolio

services:
  app:
    container_name: es-portfolio
    # Built on the server from the deployed files (CI ships public/build with them); no registry.
    image: es-portfolio:prod
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    env_file:
      - .env.prod
    restart: on-failure:3
    volumes:
      # Named volume for persistent backups
      - backups:/var/www/html/storage/app/backups
      # Named volume for local-disk uploads when MEDIA_DISK=public
      - storage:/var/www/html/storage/app/public
      # Themes installed from Portfolio -> Themes; survives rebuilds and redeploys
      - themes:/var/www/html/storage/app/themes
    networks:
      milkyway:
        # Nginx Proxy Manager still forwards edilsonsantos.co.za to the old container name; drop this
        # alias once the proxy host points at es-portfolio:80.
        aliases:
          - edfolio-prod
    environment:
      # Docker startup behavior for production
      - SKIP_ASSET_BUILD=true
      - FORCE_FRESH_DB=false
      - CREATE_DB_BACKUP=true
      - REQUIRE_DB_ON_BOOT=true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# The data volumes keep the names the first deploys created (compose project "edfolio"), so renaming
# the project and container never starts from empty volumes.
volumes:
  backups:
    name: edfolio_prod_backups
  storage:
    name: edfolio_edfolio_storage
  themes:
    name: edfolio_edfolio_themes

networks:
  milkyway:
    external: true
